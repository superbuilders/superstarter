packages:
  - packages/data/*
  - packages/product/*
  - packages/platform/*
nodeLinker: hoisted
verifyDepsBeforeRun: error
allowBuilds:
  lefthook: true
  "@tailwindcss/oxide": true
  esbuild: true
  sharp: false
  core-js: false
  workerd: false
patchedDependencies:
  "@vercel/otel@2.1.3": patches/@vercel__otel@2.1.3.patch
