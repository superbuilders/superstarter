packages:
  - packages/data/*
  - packages/product/*
  - packages/platform/*
nodeLinker: hoisted
verifyDepsBeforeRun: error
allowBuilds:
  lefthook: true
  "@tailwindcss/oxide": true
  esbuild: true
  sharp: false
  core-js: false
  workerd: false
patchedDependencies:
  "@vercel/otel@2.1.3": patches/@vercel__otel@2.1.3.patch
minimumReleaseAgeExclude:
  - "@effect/tsgo-darwin-arm64@0.56.0"
  - "@effect/tsgo-darwin-x64@0.56.0"
  - "@effect/tsgo-linux-arm64@0.56.0"
  - "@effect/tsgo-linux-arm@0.56.0"
  - "@effect/tsgo-linux-x64@0.56.0"
  - "@effect/tsgo-win32-arm64@0.56.0"
  - "@effect/tsgo-win32-x64@0.56.0"
  - "@effect/tsgo@0.56.0"
  - "@posthog/core@1.59.3"
  - drizzle-kit@1.0.0-rc.5
  - drizzle-orm@1.0.0-rc.5
  - posthog-node@5.56.4
  - lucide-react@1.61.0
